<!doctype html>
<html lang="en">
    <head>
        <!-- Sets the popup name and links its styles. -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NetScope</title>
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>
        <main class="panel">
            <!-- Explains what NetScope does. -->
            <header class="brand">
                <p class="eyebrow">GOOGLE SEARCH HELPER</p>
                <h1>NetScope</h1>
                <p class="description">Scores up to ten Google search links using simple URL clues.</p>
            </header>

            <!-- Shows and controls whether URL scoring is on. -->
            <section class="setting" aria-label="URL scoring setting">
                <div>
                    <p class="setting-name">URL scoring</p>
                    <p id="status" class="status" role="status" aria-live="polite">Loading...</p>
                </div>
                <button id="toggle" type="button" aria-pressed="true" disabled>...</button>
            </section>

            <!-- Reminds users that the score is only a basic hint. -->
            <p class="note">Scores are not a guarantee that a site is safe.</p>
        </main>
        <!-- Connects the toggle to the saved setting. -->
        <script src="popup.js"></script>
    </body>
</html>
