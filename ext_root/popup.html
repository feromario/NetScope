<!doctype html>
<html lang="en">
    <head>
        <!-- Sets the popup's name and connects its styles. -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NetScope</title>
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>
        <!-- Shows the extension's state and its on/off button. -->
        <main>
            <h1>NetScope</h1>
            <p id="status" role="status" aria-live="polite">Loading...</p>
            <button id="toggle" type="button" aria-pressed="true" disabled>Loading...</button>
        </main>
        <!-- Connects the button to the saved on/off setting. -->
        <script src="popup.js"></script>
    </body>
</html>
